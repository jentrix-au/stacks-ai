name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stacks?sslmode=disable
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/stacks?sslmode=disable
  # CI-only secret; never used outside this workflow.
  AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789abcdef
  NEXT_PUBLIC_APP_URL: http://localhost:3100

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # pgvector's image is postgres:16 + the vector extension, which the
        # semantic-embeddings migration requires (CREATE EXTENSION vector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate` (tolerates the placeholder URL).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts auto-starts `pnpm dev --port 3100`; e2e auth uses
      # the dev-only POST /api/dev/sign-in against the seeded demo user.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # `pnpm build` = prisma generate && prisma migrate deploy && next build;
      # migrate deploy is idempotent against the already-migrated service DB.
      - name: Build
        run: pnpm build
